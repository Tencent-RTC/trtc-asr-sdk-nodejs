name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Active LTS lines plus current.
        node: ["18", "20", "22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # `files: ["dist"]` means a missing build step or a stray path would ship
      # an empty package. Verify the tarball contents before publishing does.
      - name: Verify publishable contents
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf trtc-asr-*.tgz | grep -q 'package/dist/index.js'
          tar -tzf trtc-asr-*.tgz | grep -q 'package/dist/index.d.ts'
